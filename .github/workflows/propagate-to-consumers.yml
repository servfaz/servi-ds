name: Propagar Servi DS para consumidores

# Roda quando a Vercel termina o deploy de produção com sucesso: só então o
# registry em ds.servfaz.app está atualizado. Rodar no push lia o registry
# anterior, porque o deploy ainda não tinha terminado. Toda publicação na main
# (componente, token ou cadastro em automation/consumers.json) passa por um
# deploy de produção, então toda mudança chega aos consumidores.
# workflow_dispatch continua para rodar à mão a qualquer momento.
on:
  workflow_dispatch:
  deployment_status:

# Dois deploys seguidos: vale a execução mais nova, que lê o registry mais novo.
concurrency:
  group: propagar-servi-ds
  cancel-in-progress: true

jobs:
  load-consumers:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
      gitlab: ${{ steps.read.outputs.gitlab }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          echo "list=$(jq -c '[.[] | select(.platform == null or .platform == "github")]' automation/consumers.json)" >> "$GITHUB_OUTPUT"
          echo "gitlab=$(jq -c '[.[] | select(.platform == "gitlab")]' automation/consumers.json)" >> "$GITHUB_OUTPUT"

  propagate:
    needs: load-consumers
    if: needs.load-consumers.outputs.list != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        consumer: ${{ fromJson(needs.load-consumers.outputs.list) }}
    steps:
      - name: Gerar token de instalação do GitHub App
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.SERVFAZ_DS_APP_ID }}
          private-key: ${{ secrets.SERVFAZ_DS_APP_PRIVATE_KEY }}
          owner: servfaz
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.consumer.repo }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Garante o estilo Radix no components.json
        run: |
          # Com estilo Base UI ("base-..."), a CLI troca asChild por render e os
          # componentes do Servi DS (Radix) quebram. Mesma regra do script de instalação.
          STYLE=$(jq -r '.style // ""' components.json)
          if [[ "$STYLE" == base-* ]]; then
            echo "::warning title=Estilo do shadcn (${{ matrix.consumer.repo }})::components.json estava com \"$STYLE\" (Base UI) e foi trocado para \"new-york\" (Radix)."
            jq '.style = "new-york"' components.json > "$RUNNER_TEMP/components.json" && mv "$RUNNER_TEMP/components.json" components.json
          fi
      - name: Instalar componentes (e blocos pedidos no cadastro)
        env:
          BLOCOS_JSON: ${{ toJSON(matrix.consumer.blocos) }}
        run: |
          # Blocos (registry:block) só entram para quem pede em "blocos" no consumers.json.
          curl -sf https://ds.servfaz.app/r/registry.json \
            | jq -r --argjson blocos "${BLOCOS_JSON:-null}" \
              '.items[] | select(.type != "registry:block" or (.name as $n | ($blocos // []) | index($n))) | .name' \
            > "$RUNNER_TEMP/components.txt"
          while read -r name; do
            npx shadcn@latest add "https://ds.servfaz.app/r/$name.json" --yes --overwrite \
              || { echo "::error title=Propagação GitHub (${{ matrix.consumer.repo }})::Falha ao instalar o componente $name. Confira se ele depende de algum item que não está publicado no registry."; exit 1; }
          done < "$RUNNER_TEMP/components.txt"
      - name: Corrige import de utils quebrado pelo CLI do shadcn
        run: |
          UTILS_ALIAS=$(jq -r '.aliases.utils // .aliases.lib // "@/lib/utils"' components.json)
          if [ "$UTILS_ALIAS" != "@/app/lib/utils" ]; then
            MATCHES=$(grep -rl 'from "@/app/lib/utils"' src --include="*.ts" --include="*.tsx" 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "$MATCHES" | xargs sed -i "s#from \"@/app/lib/utils\"#from \"$UTILS_ALIAS\"#g"
            fi
          fi
      - uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: atualiza componentes do Servfaz DS"
          title: "Atualizacao automatica: Servfaz DS"
          branch: chore/update-servfaz-ds
          delete-branch: true

  # Consumidores no GitLab: { "repo": "grupo/projeto", "platform": "gitlab" }.
  # Campos opcionais: "host" (padrão gitlab.com), "token_secret"
  # (nome do secret com o token daquele projeto; padrão SERVFAZ_DS_GITLAB_TOKEN)
  # e "blocos" (lista de blocos a instalar, ex. ["app-shell"]; vale também no GitHub).
  propagate-gitlab:
    needs: load-consumers
    if: needs.load-consumers.outputs.gitlab != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        consumer: ${{ fromJson(needs.load-consumers.outputs.gitlab) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Atualizar e abrir Merge Request em ${{ matrix.consumer.repo }}
        env:
          GITLAB_PROJECT: ${{ matrix.consumer.repo }}
          GITLAB_HOST: ${{ matrix.consumer.host || 'gitlab.com' }}
          GITLAB_TOKEN: ${{ secrets[matrix.consumer.token_secret || 'SERVFAZ_DS_GITLAB_TOKEN'] }}
          BLOCOS_JSON: ${{ toJSON(matrix.consumer.blocos) }}
        run: |
          SERVI_DS_BLOCOS="$(jq -r '(. // []) | join(" ")' <<<"${BLOCOS_JSON:-null}")"
          export SERVI_DS_BLOCOS
          bash scripts/propagate-gitlab.sh
